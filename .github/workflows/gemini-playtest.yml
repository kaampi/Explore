name: Gemini live playtest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'
permissions:
  contents: read
jobs:
  gemini-playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run live model scenarios
        if: env.GEMINI_API_KEY != ''
        run: npx tsx scripts/gemini-physical-playtest.ts
      - name: Explain missing secret
        if: env.GEMINI_API_KEY == ''
        run: |
          echo "::error::GEMINI_API_KEY secret is missing."
          exit 1
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-physical-playtest
          path: artifacts/gemini-physical-playtest.*
          if-no-files-found: ignore
